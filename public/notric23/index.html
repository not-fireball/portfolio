<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Ric!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --a:#6d28d9; --b:#db2777; --c:#f97316;
  --ink:#ffffff; --btn:#4c1d95; --btn-edge:#2e1065;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color:var(--ink);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320' fill='white' fill-opacity='.09'><circle cx='40' cy='50' r='26'/><rect x='150' y='30' width='46' height='46' rx='6' transform='rotate(14 173 53)'/><polygon points='270,30 300,90 240,90'/><circle cx='110' cy='170' r='14'/><polygon points='40,230 80,300 0,300'/><rect x='200' y='190' width='60' height='60' rx='8' transform='rotate(-18 230 220)'/><circle cx='290' cy='270' r='20'/><rect x='120' y='260' width='30' height='30' rx='5' transform='rotate(30 135 275)'/></svg>"),
    #000;
  background-attachment:fixed;
  overflow:hidden;
}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;z-index:2}
h1{font-size:clamp(2.6rem,10vw,6.5rem);line-height:.95;margin:0;font-weight:700;letter-spacing:-.01em;text-shadow:0 6px 24px rgba(46,16,101,.35)}
.sub{font-size:clamp(1.1rem,3.2vw,1.7rem);margin:14px 0 0;font-weight:500;opacity:.95}
.stage{margin:34px 0 0;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
button{font:inherit;color:var(--ink);background:var(--btn);border:0;border-radius:14px;padding:12px 26px;font-size:1.15rem;font-weight:600;cursor:pointer;box-shadow:0 5px 0 var(--btn-edge);transition:transform .08s,box-shadow .08s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
button:focus-visible,.gift:focus-visible{outline:3px solid #fff;outline-offset:4px}
.gift{all:unset;cursor:pointer;position:relative;display:block;animation:wobble 2.4s ease-in-out infinite}
.gift img{display:block;width:240px;max-width:70vw;height:auto;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .5s}
.gift.open img{transform:scale(1.35);opacity:0}
.gift.fallback{width:150px;height:150px}
.gift .box,.gift .lid{display:none}
.gift.fallback .box,.gift.fallback .lid{display:block}
.gift .box{position:absolute;left:10px;right:10px;bottom:0;height:95px;background:#fde68a;border-radius:6px 6px 14px 14px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.gift .box::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:#ef4444}
.gift .lid{position:absolute;left:0;right:0;bottom:90px;height:44px;background:#fcd34d;border-radius:10px;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .6s;z-index:2}
.gift .lid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:#dc2626}
.gift .lid::before{content:"";position:absolute;left:50%;top:-22px;width:46px;height:30px;margin-left:-23px;border:8px solid #dc2626;border-radius:50% 50% 8px 8px}
.gift.open{animation:none}
.gift.open .lid{transform:translateY(-120px) rotate(-18deg);opacity:0}
@keyframes wobble{0%,100%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(5deg)}30%{transform:rotate(-3deg)}40%{transform:rotate(0)}}
.hint{margin-top:18px;font-size:1.05rem;opacity:.9}
.card{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);border-radius:22px;padding:26px 34px;max-width:520px;display:none;text-align:center;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:600}
.card.show{display:block;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
footer{position:fixed;left:0;right:0;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:1.1rem;font-weight:500;z-index:2;opacity:.9}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.actions{margin-top:22px;display:none}
.actions.show{display:block}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
@media (prefers-reduced-motion:reduce){.gift{animation:none}.card.show{animation:none}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="stage">
    <button class="gift" id="gift" aria-label="Open your gift"><img src="ps99giftbag.png" alt="" onerror="this.parentNode.classList.add('fallback');this.remove()"><span class="box"></span><span class="lid"></span></button>
    <p class="hint" id="hint">don't click</p>
    <div class="card" id="card"></div>
    <div class="actions" id="actions"><button id="again">more confetti!</button></div>
  </div>
</main>
<footer>from fireball :&gt;</footer>
<canvas id="fx"></canvas>
<script>
const NAME="Ric";
const MESSAGE="from fireball :>";

document.getElementById("title").innerHTML="Happy Birthday,<br>"+NAME+"!";
const card=document.getElementById("card");
card.textContent=MESSAGE;

const cv=document.getElementById("fx"),cx=cv.getContext("2d");
let W,H,parts=[],raf=null;
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
size();addEventListener("resize",size);
const colors=["#fde68a","#ffffff","#fca5a5","#a7f3d0","#bfdbfe","#f0abfc"];
function burst(n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=6+Math.random()*10;
    parts.push({x:W/2,y:H*.55,vx:Math.cos(a)*s,vy:Math.sin(a)*s-8,r:4+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],sq:Math.random()<.5,life:0});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.y<H+20&&p.life<260);
  for(const p of parts){
    p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.sq)cx.fillRect(-p.r,-p.r,p.r*2,p.r*2);else{cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill()}
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):null;
  if(!parts.length)cx.clearRect(0,0,W,H);
}

const gift=document.getElementById("gift");
gift.addEventListener("click",()=>{
  if(gift.classList.contains("open"))return;
  gift.classList.add("open");
  document.getElementById("hint").style.display="none";
  burst(160);
  setTimeout(()=>{gift.style.display="none";card.classList.add("show");document.getElementById("actions").classList.add("show");burst(80)},650);
});
document.getElementById("again").addEventListener("click",()=>burst(180));
</script>
</body>
</html>
